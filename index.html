<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Direktori Sekolah Bahasa Jepang</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EEF1F5;
  --surface:#FFFFFF;
  --ink:#16233F;
  --ink-soft:#5A6782;
  --line:#D9DFE8;
  --indigo:#233E78;
  --indigo-dark:#182C57;
  --tint:#E3E9F5;
  --hanko:#C8362B;
  --serif:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --sans:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.55}
a{color:inherit}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--indigo);outline-offset:2px;border-radius:4px}

.shell{display:grid;grid-template-columns:300px minmax(0,1fr);gap:0;max-width:1400px;margin:0 auto;min-height:100vh}

/* sidebar */
.side{position:sticky;top:0;height:100vh;overflow-y:auto;padding:28px 20px 28px 28px;background:var(--indigo-dark);color:#E8EDF8}
.brand{display:flex;gap:12px;align-items:center;margin-bottom:26px}
.seal{flex:none;width:44px;height:44px;border-radius:8px;background:var(--hanko);color:#fff;display:grid;place-items:center;font-family:var(--serif);font-weight:800;font-size:25px;line-height:1;transform:rotate(-4deg)}
.brand b{display:block;font-family:var(--serif);font-size:19px;line-height:1.2}
.brand span{font-size:13px;color:#A9B7D6}
.all-btn,.pref{display:grid;grid-template-columns:1fr auto;align-items:center;width:100%;text-align:left;background:none;border:0;border-radius:6px;padding:7px 10px;color:inherit;cursor:pointer;position:relative;overflow:hidden}
.all-btn{margin-bottom:6px;font-weight:700}
.region{font-size:13px;font-weight:700;color:#8FA2CC;margin:20px 10px 6px}
.pref .bar{position:absolute;inset:0 auto 0 0;background:rgba(143,162,204,.18);z-index:0;border-radius:6px}
.pref span,.pref em,.all-btn span,.all-btn em{position:relative;z-index:1}
.pref .ja{font-size:15px}
.pref .en{display:block;font-size:12px;color:#A9B7D6}
.pref em,.all-btn em{font-style:normal;font-variant-numeric:tabular-nums;font-size:14px;color:#C9D4EC}
.pref:hover,.all-btn:hover{background:rgba(255,255,255,.07)}
.pref[aria-pressed="true"],.all-btn[aria-pressed="true"]{background:#F4F6FB;color:var(--indigo-dark)}
.pref[aria-pressed="true"] .en,.pref[aria-pressed="true"] em,.all-btn[aria-pressed="true"] em{color:var(--ink-soft)}
.pref[aria-pressed="true"] .bar{background:var(--tint)}

/* main */
main{padding:36px 40px 80px;min-width:0}
h1{font-family:var(--serif);font-weight:800;font-size:clamp(30px,4.2vw,50px);line-height:1.12;margin:0 0 8px;letter-spacing:.01em}
.lead{margin:0 0 26px;color:var(--ink-soft);max-width:60ch}
.tools{display:flex;flex-wrap:wrap;gap:12px;align-items:center;position:sticky;top:0;z-index:5;background:var(--paper);padding:12px 0 14px}
.search{flex:1 1 320px;position:relative}
.search input{width:100%;height:50px;border:2px solid var(--line);border-radius:10px;padding:0 44px 0 16px;background:var(--surface);font-size:17px}
.search input:focus{border-color:var(--indigo);outline:none;box-shadow:0 0 0 4px rgba(35,62,120,.15)}
.search button{position:absolute;right:6px;top:7px;width:36px;height:36px;border:0;border-radius:8px;background:none;cursor:pointer;font-size:22px;color:var(--ink-soft);display:none}
.search button:hover{background:var(--tint)}
select{height:50px;border:2px solid var(--line);border-radius:10px;padding:0 12px;background:var(--surface);cursor:pointer}
.mob-pref{display:none}
.status{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:6px 0 14px;color:var(--ink-soft);font-size:15px}
.chip{display:inline-flex;align-items:center;gap:8px;background:var(--indigo);color:#fff;border:0;border-radius:99px;padding:3px 6px 3px 14px;cursor:pointer;font-size:14px}
.chip i{font-style:normal;width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,.22);display:grid;place-items:center;font-size:14px;line-height:1}

/* list */
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.row{display:grid;grid-template-columns:64px minmax(0,1fr) 150px auto;gap:18px;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row:hover{background:#F7F9FC}
.no{font-variant-numeric:tabular-nums;color:var(--ink-soft);font-size:15px}
.names h2{margin:0;font-family:var(--serif);font-weight:700;font-size:20px;line-height:1.35;overflow-wrap:anywhere}
.names p{margin:2px 0 0;color:var(--ink-soft);font-size:14px;overflow-wrap:anywhere}
.where{font-size:14px}
.where b{display:block;font-family:var(--serif);font-size:17px}
.where span{color:var(--ink-soft)}
.acts{display:flex;gap:8px}
.btn{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 14px;border-radius:8px;text-decoration:none;font-size:14px;font-weight:700;white-space:nowrap;border:2px solid var(--indigo)}
.btn.map{background:var(--indigo);color:#fff}
.btn.map:hover{background:var(--indigo-dark);border-color:var(--indigo-dark)}
.btn.web{background:transparent;color:var(--indigo)}
.btn.web:hover{background:var(--tint)}
.btn svg{width:16px;height:16px;flex:none}

.more{display:block;margin:22px auto 0;height:48px;padding:0 28px;border-radius:10px;border:2px solid var(--indigo);background:var(--surface);color:var(--indigo);font-weight:700;cursor:pointer}
.more:hover{background:var(--tint)}
.empty,.error{padding:44px 24px;text-align:center;color:var(--ink-soft)}
.empty b,.error b{display:block;color:var(--ink);font-family:var(--serif);font-size:22px;margin-bottom:6px}
.error label{display:inline-block;margin-top:16px;padding:12px 20px;border-radius:10px;background:var(--indigo);color:#fff;font-weight:700;cursor:pointer}
.error input{position:absolute;opacity:0;width:1px;height:1px}
.error input:focus-visible + span{outline:3px solid var(--indigo);outline-offset:3px}
footer{margin-top:40px;color:var(--ink-soft);font-size:13px}

@media (max-width:1100px){
  .row{grid-template-columns:48px minmax(0,1fr) auto;row-gap:10px}
  .where{grid-column:2;grid-row:2}
  .acts{grid-column:3;grid-row:1 / span 2}
}
@media (max-width:860px){
  .shell{grid-template-columns:1fr}
  .side{display:none}
  main{padding:24px 16px 60px}
  .mob-pref{display:block;flex:1 1 100%}
  .mob-pref select{width:100%}
  .row{grid-template-columns:1fr;padding:16px}
  .no{font-size:13px}
  .where,.acts{grid-column:auto;grid-row:auto}
  .btn{flex:1;justify-content:center}
  .acts{width:100%}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
</head>
<body>
<div class="shell">
  <aside class="side" aria-label="Filter prefektur">
    <div class="brand">
      <div class="seal" aria-hidden="true">学</div>
      <div><b>日本語学校</b><span>Sekolah bahasa Jepang</span></div>
    </div>
    <nav id="prefNav"></nav>
  </aside>

  <main>
    <h1>Direktori sekolah bahasa Jepang</h1>
    <p class="lead" id="lead">Memuat data…</p>

    <div class="tools">
      <div class="search">
        <input id="q" type="search" placeholder="Cari nama sekolah, huruf Jepang atau Latin" aria-label="Cari sekolah" autocomplete="off">
        <button id="clearQ" type="button" aria-label="Hapus pencarian">×</button>
      </div>
      <label class="mob-pref"><select id="prefSelect" aria-label="Pilih prefektur"></select></label>
      <select id="sort" aria-label="Urutkan">
        <option value="no">Urut nomor resmi</option>
        <option value="en">Urut nama (A–Z)</option>
        <option value="pref">Urut prefektur</option>
      </select>
    </div>

    <div class="status" id="status" aria-live="polite"></div>
    <div id="out"></div>
    <footer id="foot"></footer>
  </main>
</div>

<script>
(function(){
  var DATA_URL = 'nihongo_gakkou.json';
  var PAGE = 60;
  var REGIONS = [
    ['Hokkaido',['Hokkaido']],
    ['Tohoku',['Aomori','Iwate','Miyagi','Akita','Yamagata','Fukushima']],
    ['Kanto',['Ibaraki','Tochigi','Gunma','Saitama','Chiba','Tokyo','Kanagawa']],
    ['Chubu',['Niigata','Toyama','Ishikawa','Fukui','Yamanashi','Nagano','Gifu','Shizuoka','Aichi']],
    ['Kinki',['Mie','Shiga','Kyoto','Osaka','Hyogo','Nara','Wakayama']],
    ['Chugoku',['Tottori','Shimane','Okayama','Hiroshima','Yamaguchi']],
    ['Shikoku',['Tokushima','Kagawa','Ehime','Kochi']],
    ['Kyushu dan Okinawa',['Fukuoka','Saga','Nagasaki','Kumamoto','Oita','Miyazaki','Kagoshima','Okinawa']]
  ];
  var state = {all:[], pref:'', q:'', sort:'no', shown:PAGE, meta:{}};
  var $ = function(id){return document.getElementById(id)};
  var out=$('out'), status=$('status'), nav=$('prefNav');

  var norm = function(s){return (s||'').normalize('NFKC').toLowerCase()};
  var esc = function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};

  var ICON_MAP = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s7-6.2 7-11.5A7 7 0 0 0 5 9.5C5 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>';
  var ICON_WEB = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>';

  function load(){
    fetch(DATA_URL,{cache:'no-cache'})
      .then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
      .then(init)
      .catch(showError);
  }

  function showError(){
    $('lead').textContent = 'Data belum bisa dimuat.';
    out.innerHTML = '<div class="list"><div class="error"><b>File nihongo_gakkou.json tidak ditemukan</b>'
      + 'Simpan file ini satu folder dengan index.html lalu buka lewat server (misalnya GitHub Pages). '
      + 'Jika membuka langsung dari komputer, pilih file JSON secara manual.<br>'
      + '<label><input type="file" accept="application/json,.json" id="pick"><span>Pilih file JSON</span></label></div></div>';
    $('pick').addEventListener('change',function(e){
      var f=e.target.files[0]; if(!f) return;
      var rd=new FileReader();
      rd.onload=function(){ try{ init(JSON.parse(rd.result)); }catch(err){ alert('File JSON tidak valid.'); } };
      rd.readAsText(f);
    });
  }

  function init(d){
    var list = d.schools || [];
    state.meta = d;
    state.all = list.map(function(s){
      s._k = norm([s.name_ja,s.name_en,s.prefecture_ja,s.prefecture_en].join(' '));
      s._en = norm(s.name_en);
      return s;
    });
    $('lead').textContent = d.total + ' lembaga pendidikan bahasa Jepang yang tercantum dalam daftar resmi (data per ' + fmtDate(d.as_of) + '). Cari sekolah, lalu buka lokasinya di peta.';
    $('foot').textContent = 'Sumber: ' + (d.source || '') + '. Tombol peta dan cari situs membuka pencarian Google berdasarkan nama sekolah dan prefektur.';
    buildNav();
    render(true);
  }

  function fmtDate(iso){
    if(!iso) return '';
    var m=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
    var p=iso.split('-'); return +p[2]+' '+m[+p[1]-1]+' '+p[0];
  }

  function buildNav(){
    var cnt={}, ja={};
    state.all.forEach(function(s){ cnt[s.prefecture_en]=(cnt[s.prefecture_en]||0)+1; ja[s.prefecture_en]=s.prefecture_ja; });
    var max=Math.max.apply(null,Object.keys(cnt).map(function(k){return cnt[k]}));
    var html='<button class="all-btn" data-pref="" aria-pressed="true"><span>Semua prefektur</span><em>'+state.all.length+'</em></button>';
    var sel='<option value="">Semua prefektur ('+state.all.length+')</option>';
    REGIONS.forEach(function(r){
      var items=r[1].filter(function(p){return cnt[p]});
      if(!items.length) return;
      html+='<div class="region">'+esc(r[0])+'</div>';
      sel+='<optgroup label="'+esc(r[0])+'">';
      items.forEach(function(p){
        var w=Math.max(4,Math.round(cnt[p]/max*100));
        html+='<button class="pref" data-pref="'+esc(p)+'" aria-pressed="false"><i class="bar" style="width:'+w+'%"></i><span><span class="ja">'+esc(ja[p])+'</span><span class="en">'+esc(p)+'</span></span><em>'+cnt[p]+'</em></button>';
        sel+='<option value="'+esc(p)+'">'+esc(ja[p])+' '+esc(p)+' ('+cnt[p]+')</option>';
      });
      sel+='</optgroup>';
    });
    nav.innerHTML=html;
    $('prefSelect').innerHTML=sel;
  }

  function setPref(p){
    state.pref=p; state.shown=PAGE;
    Array.prototype.forEach.call(nav.querySelectorAll('button'),function(b){
      b.setAttribute('aria-pressed', String(b.getAttribute('data-pref')===p));
    });
    $('prefSelect').value=p;
    render(true);
  }

  function filtered(){
    var q=norm(state.q).trim(), terms=q?q.split(/\s+/):[];
    var res=state.all.filter(function(s){
      if(state.pref && s.prefecture_en!==state.pref) return false;
      for(var i=0;i<terms.length;i++){ if(s._k.indexOf(terms[i])<0) return false; }
      return true;
    });
    if(state.sort==='en') res.sort(function(a,b){return a._en<b._en?-1:a._en>b._en?1:0});
    else if(state.sort==='pref') res.sort(function(a,b){return a.prefecture_en.localeCompare(b.prefecture_en)||a.no-b.no});
    else res.sort(function(a,b){return a.no-b.no});
    return res;
  }

  function rowHTML(s){
    return '<article class="row">'
      +'<div class="no">No. '+s.no+'</div>'
      +'<div class="names"><h2 lang="ja">'+esc(s.name_ja)+'</h2><p>'+esc(s.name_en)+'</p></div>'
      +'<div class="where"><b lang="ja">'+esc(s.prefecture_ja)+'</b><span>'+esc(s.prefecture_en)+'</span></div>'
      +'<div class="acts">'
      +'<a class="btn map" href="'+esc(s.google_maps)+'" target="_blank" rel="noopener">'+ICON_MAP+'Peta</a>'
      +'<a class="btn web" href="'+esc(s.website_search)+'" target="_blank" rel="noopener">'+ICON_WEB+'Cari situs</a>'
      +'</div></article>';
  }

  function render(reset){
    var res=filtered(), total=res.length, part=res.slice(0,state.shown);
    var st='Menampilkan '+part.length+' dari '+total+' sekolah';
    if(state.pref){
      st+=' <button class="chip" id="rmPref" type="button" aria-label="Hapus filter prefektur">'+esc(state.pref)+'<i>×</i></button>';
    }
    status.innerHTML=st;
    var rm=$('rmPref'); if(rm) rm.addEventListener('click',function(){setPref('')});

    if(!total){
      out.innerHTML='<div class="list"><div class="empty"><b>Tidak ada sekolah yang cocok</b>Coba kata kunci lain atau hapus filter prefektur.</div></div>';
      return;
    }
    var html='<div class="list">'+part.map(rowHTML).join('')+'</div>';
    if(total>part.length) html+='<button class="more" id="more" type="button">Tampilkan '+Math.min(PAGE,total-part.length)+' sekolah lagi</button>';
    out.innerHTML=html;
    var more=$('more');
    if(more) more.addEventListener('click',function(){state.shown+=PAGE;render();});
  }

  nav.addEventListener('click',function(e){
    var b=e.target.closest('button'); if(!b) return;
    setPref(b.getAttribute('data-pref'));
    window.scrollTo({top:0});
  });
  $('prefSelect').addEventListener('change',function(e){setPref(e.target.value)});
  $('sort').addEventListener('change',function(e){state.sort=e.target.value; state.shown=PAGE; render();});

  var timer;
  $('q').addEventListener('input',function(e){
    var v=e.target.value;
    $('clearQ').style.display=v?'block':'none';
    clearTimeout(timer);
    timer=setTimeout(function(){state.q=v; state.shown=PAGE; render();},120);
  });
  $('clearQ').addEventListener('click',function(){
    $('q').value=''; this.style.display='none'; state.q=''; state.shown=PAGE; render(); $('q').focus();
  });

  load();
})();
</script>
</body>
</html>
